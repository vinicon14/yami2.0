<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" />
  <!-- Glow -->
  <circle cx="128" cy="128" r="110" fill="url(#glow)"/>
  <!-- Robot face -->
  <!-- Head -->
  <rect x="68" y="72" width="120" height="100" rx="16" ry="16" fill="#e2e8f0" opacity="0.95"/>
  <!-- Antenna -->
  <line x1="128" y1="72" x2="128" y2="50" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="128" cy="44" r="8" fill="#60a5fa"/>
  <!-- Eyes -->
  <rect x="88" y="96" width="30" height="22" rx="5" fill="#3b82f6"/>
  <rect x="138" y="96" width="30" height="22" rx="5" fill="#3b82f6"/>
  <!-- Eye shine -->
  <circle cx="96" cy="102" r="4" fill="#93c5fd"/>
  <circle cx="146" cy="102" r="4" fill="#93c5fd"/>
  <!-- Mouth -->
  <rect x="92" y="133" width="72" height="18" rx="6" fill="#3b82f6"/>
  <rect x="100" y="138" width="10" height="8" rx="2" fill="#93c5fd"/>
