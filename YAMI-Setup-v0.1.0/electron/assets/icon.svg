  <rect x="136" y="138" width="10" height="8" rx="2" fill="#93c5fd"/>
  <!-- Ears / bolts -->
  <rect x="56" y="100" width="14" height="20" rx="4" fill="#94a3b8"/>
  <rect x="186" y="100" width="14" height="20" rx="4" fill="#94a3b8"/>
  <!-- Body  -->
  <rect x="84" y="176" width="88" height="50" rx="12" fill="#1e40af"/>
