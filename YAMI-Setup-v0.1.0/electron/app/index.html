<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YAMI - Personal AI Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      width: 250px;
      background: rgba(15, 23, 42, 0.8);
      border-right: 1px solid rgba(100, 116, 139, 0.2);
      padding: 20px;
      overflow-y: auto;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tamagoshi-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    .tamagoshi {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle at 30% 30%, rgba(100, 116, 139, 0.3), rgba(15, 23, 42, 0.8));
      border: 3px solid rgba(100, 116, 139, 0.5);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 30px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .tamagoshi-face {
      font-size: 80px;
      text-align: center;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .tamagoshi-eyes {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .tamagoshi-mouth {
      font-size: 30px;
    }

    .status-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }

    .status-item {
      background: rgba(100, 116, 139, 0.1);
      border: 1px solid rgba(100, 116, 139, 0.3);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .status-label {
      font-size: 12px;
      color: rgba(203, 213, 225, 0.7);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .status-value {
      font-size: 18px;
      font-weight: bold;
      color: #60a5fa;
    }

    .chat-area {
      flex: 0 0 300px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(100, 116, 139, 0.2);
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      background: rgba(59, 130, 246, 0.2);
      border-left: 3px solid #3b82f6;
      margin-left: 20px;
    }

    .message.ai {
      background: rgba(100, 116, 139, 0.2);
      border-left: 3px solid #64748b;
      margin-right: 20px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      background: rgba(100, 116, 139, 0.1);
      border: 1px solid rgba(100, 116, 139, 0.3);
      border-radius: 6px;
      padding: 10px 12px;
      color: white;
      font-size: 13px;
    }

    .input-area input::placeholder {
      color: rgba(203, 213, 225, 0.5);
    }

    .input-area input:focus {
      outline: none;
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }

    .btn {
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .sidebar-item {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      border-left: 3px solid transparent;
    }

    .sidebar-item:hover {
      background: rgba(100, 116, 139, 0.2);
    }

    .sidebar-item.active {
      background: rgba(59, 130, 246, 0.2);
      border-left-color: #3b82f6;
    }

    .onboarding {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .onboarding-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
    }

    .onboarding-title {
      font-size: 28px;
      margin-bottom: 20px;
      color: #60a5fa;
    }

    .onboarding-step {
      display: none;
    }

    .onboarding-step.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: rgba(203, 213, 225, 0.8);
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 10px;
      background: rgba(100, 116, 139, 0.1);
      border: 1px solid rgba(100, 116, 139, 0.3);
      border-radius: 6px;
      color: white;
      font-size: 13px;
    }

    .tamagoshi-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .tamagoshi-option {
      aspect-ratio: 1;
      background: rgba(100, 116, 139, 0.1);
      border: 2px solid rgba(100, 116, 139, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tamagoshi-option:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }

    .tamagoshi-option.selected {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .onboarding-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
    }

    .btn-secondary {
      background: rgba(100, 116, 139, 0.2);
      border: 1px solid rgba(100, 116, 139, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(100, 116, 139, 0.3);
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Onboarding will be inserted here -->
    <div class="container">
      <div class="sidebar">
        <h2 style="font-size: 18px; margin-bottom: 20px; color: #60a5fa;">YAMI</h2>
        <div class="sidebar-item active" data-page="home">💬 Chat</div>
        <div class="sidebar-item" data-page="calendar">📅 Agenda</div>
        <div class="sidebar-item" data-page="integrations">🔗 Integrações</div>
        <div class="sidebar-item" data-page="settings">⚙️ Configurações</div>
      </div>

      <div class="main-content">
        <div class="tamagoshi-area">
          <div class="tamagoshi">
            <div class="tamagoshi-face">
              <div class="tamagoshi-eyes" id="tamagoshi-emoji">😊</div>
              <div class="tamagoshi-mouth" style="margin-top: 15px;">░░░</div>
            </div>
          </div>
          <div class="status-info">
            <div class="status-item">
              <div class="status-label">Energia</div>
              <div class="status-value" id="energy">85%</div>
            </div>
            <div class="status-item">
              <div class="status-label">Felicidade</div>
              <div class="status-value" id="happiness">92%</div>
            </div>
            <div class="status-item">
              <div class="status-label">Aprendizado</div>
              <div class="status-value" id="learning">76%</div>
            </div>
          </div>
        </div>

        <div class="chat-area">
          <div class="messages" id="messages">
            <div class="message ai">Olá! Sou YAMI, seu assistente de IA pessoal. Como posso ajudá-lo?</div>
          </div>
          <div class="input-area">
            <input type="text" id="input" placeholder="Digite sua mensagem..." />
            <button class="btn" id="send-btn">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
