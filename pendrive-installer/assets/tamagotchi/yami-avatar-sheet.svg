<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1c3036"/>
      <stop offset="60%" stop-color="#08101a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="pupil" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#66aabb"/>
      <stop offset="40%" stop-color="#1a4a6a"/>
      <stop offset="100%" stop-color="#0a2030"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(85,230,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(85,230,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Body/Head -->
  <circle cx="200" cy="200" r="160" fill="url(#bg)" stroke="rgba(85,230,255,0.3)" stroke-width="1"/>
  <circle cx="200" cy="200" r="180" fill="url(#glow)"/>
  <!-- Left Eye -->
  <ellipse cx="150" cy="145" rx="40" ry="50" fill="#0f1e28" stroke="rgba(85,230,255,0.15)" stroke-width="1"/>
  <circle cx="150" cy="145" r="16" fill="url(#pupil)"/>
  <circle cx="143" cy="138" r="5" fill="rgba(255,255,255,0.6)"/>
  <!-- Right Eye -->
  <ellipse cx="250" cy="145" rx="40" ry="50" fill="#0f1e28" stroke="rgba(85,230,255,0.15)" stroke-width="1"/>
  <circle cx="250" cy="145" r="16" fill="url(#pupil)"/>
  <circle cx="243" cy="138" r="5" fill="rgba(255,255,255,0.6)"/>
  <!-- Cheeks -->
  <ellipse cx="105" cy="210" rx="35" ry="12" fill="rgba(255,120,160,0.15)"/>
  <ellipse cx="295" cy="210" rx="35" ry="12" fill="rgba(255,120,160,0.15)"/>
  <!-- Mouth (default: gentle smile) -->
  <path d="M 160 225 Q 200 250 240 225" fill="none" stroke="rgba(85,230,255,0.5)" stroke-width="3" stroke-linecap="round"/>
</svg>
